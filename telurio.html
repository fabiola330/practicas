   <h1>Telurio</h1> 
   <img src="telurio.jpg" alt="">
   <label for="telurio">El telurio es un elemento relativamente estable, <br>
    insoluble en agua y ácido clorhídrico, pero soluble en ácido nítrico y <br>
    en agua regia. Reacciona con un exceso de cloro para formar dicloruro de <br>
    teluro, TeCl2 y tetracloruro de teluro, TeCl4. Se oxida con ácido nítrico <br>
    y produce dióxido de teluro, TeO2, y con ácido crómico para dar ácido telúrico,<br>
    H2TeO4. </label>
